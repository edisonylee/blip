name: blip
options:
  bundleIdPrefix: com.edisonlee.blip
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: MYGAYC672C
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  blip:
    type: application
    platform: iOS
    sources:
      - path: blip
        excludes:
          - "**/.DS_Store"
    info:
      path: blip/Resources/Info.plist
      properties:
        CFBundleDisplayName: blip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "blip uses your camera to record your daily clips for your group's blip."
        NSMicrophoneUsageDescription: "blip uses your microphone so your clips have sound."
        NSPhotoLibraryAddUsageDescription: "Save the day's stitched vlog to your photos."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - app-1-625817268885-ios-3afc6dbd3b3bd631d0619c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edisonlee.blip
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: blip/blip.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

schemes:
  blip:
    build:
      targets:
        blip: all
    run:
      config: Debug
    archive:
      config: Release
